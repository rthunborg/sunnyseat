<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"/>
<title>SunnySeat — Desktop (Free)</title>
<meta name="viewport" content="width=1440"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #1a1610;
    font-family: 'Manrope', sans-serif; }
  #root { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    padding: 28px; }
  /* Ensure animations always settle to their end-state in any iframe context */
  [style*="animation"] { animation-fill-mode: both !important; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scale-in { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  @keyframes slide-in-right { from { transform: translateX(100%); } to { transform: translateX(0); } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="src-desktop/data.jsx"></script>
<script type="text/babel" src="src-desktop/icons.jsx"></script>
<script type="text/babel" src="browser-window.jsx"></script>
<script type="text/babel" src="src-desktop/tweaks-panel.jsx"></script>

<script type="text/babel" src="src-desktop/Pins.jsx"></script>
<script type="text/babel" src="src-desktop/MapCanvas.jsx"></script>
<script type="text/babel" src="src-desktop/PlaceholderThumb.jsx"></script>
<script type="text/babel" src="src-desktop/TopBar.jsx"></script>
<script type="text/babel" src="src-desktop/Sidebar.jsx"></script>
<script type="text/babel" src="src-desktop/TimeScrubber.jsx"></script>
<script type="text/babel" src="src-desktop/QuickInfo.jsx"></script>

<script type="text/babel" src="src-desktop/AboutModal.jsx"></script>

<script type="text/babel" src="src-desktop/Tweaks.jsx"></script>
<script type="text/babel" src="src-desktop/App.jsx"></script>

<script type="text/babel" data-presets="react">
  function Root() {
    return (
      <div data-screen-label="SunnySeat Desktop — Free" style={{
        width: 1280, height: 820, position: 'relative',
      }}>
        <ChromeWindow
          tabs={[{ title: 'SunnySeat — Solplatser i Göteborg', active: true }]}
          activeIndex={0}
          url="sunnyseat.se/karta"
          width={1280}
          height={820}
        >
          <div style={{ position: 'relative', width: '100%', height: '100%' }}>
            <App flavor="free"/>
          </div>
        </ChromeWindow>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>

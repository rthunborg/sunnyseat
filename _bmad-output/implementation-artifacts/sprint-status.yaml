# Note (2026-06-15, course-correction): Story 8.1 spot-check validation (AC2) surfaced a systemic data issue and a course-correction was approved by Rasmus (see 8-1-course-correction-2026-06-15.md). The conservative 3.0.3/3.0.4 filter marks ~1,569 real >=10 m buildings (1,213 >=20 m) review/INACTIVE purely because their height estimate is uncertain (large-z-spread/single-line-tall/limited-line-support) though footprints are certain (Lantmateriet) -> engine casts no shadow -> systematic FALSE-SUNNY in the dense central clusters (Avenyn/Vasastan/Inom Vallgraven/Lilla Bommen). Confirmed via OSM "ShadeMap-equivalent" cross-check + maintainer sampling + investigation (of 11 ours=sunny/OSM=shadowed divergences, ~8 had a real 24-69 m building present but review/inactive adjacent; 1 coverage gap; 2 our verdict likely right). Local prototype (review activated at conservative ~15 m height) resolved 7/8 false-sunnies, flipping only sunny->shadowed. DECISION: (1) re-scope 8.1 to its import+RPC deliverables (AC1+AC3 done & verified) and carry the AC2 spot-check gate to a new follow-up; (2) created Story 8.1.1 "Activate Height-Uncertain Shadow Casters & Re-validate Coverage" (ready-for-dev) to revise the filter (reclassify footprint-certain/height-uncertain byggnad_l review rows to include/active with a conservative height + lowered quality_score so 3.0.5 down-weights rather than the filter dropping them; note: active=>include is DB-enforced so they must be reclassified, not just flipped active), re-derive/re-import/re-validate, and update the shadow-data-trust ADR; (3) sequence 8.1.1 NEXT, before 8.2/8.3 (8.3 needs trustworthy shadows); (4) leave the current conservative import live (3.0.5 fail-closed protects users) until 8.1.1 replaces it. 8.1.1 was dev-drafted from the prototype evidence; recommend SM story-file-audit before dev. Next step for 8.1: commit the pipeline bug-fixes + records, run story-review.sh, mark review->done on AC1/AC3 (the in-progress->review flip stays gated via the script).

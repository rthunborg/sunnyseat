or-seating-area polygon, so 8.3 also adds an additive/nullable/SERVER-ONLY seating_area jsonb column to the venues contract + optional StoredVenue.seatingArea mapping (never serialized into VenueDataDto — seed venues null → fallback → gate venue byte-identical); populating real polygons for live venues is ongoing manual venue-data work, out of 8.3 scope; (C) bypass the fixture-era applyPlannerSelectionToVenue on the real path (engine computes for the requested Europe/Stockholm time directly — no double seasonal sim); (D) compute-on-request for ~7 launch venues (concurrent, never a 500) under the existing 30s cache/rate limit, precompute (Cron) flagged as follow-up only. DTO mappers to add: skyCondition from Met.no cloud_area_fraction (<20 clear / 20-60 partly-cloudy / >60 overcast / unavailable on failure), sunWindow from a same-day timeline, predictionUncertainty from coverage status + obstructionRisks + weather mapped onto the existing PredictionUncertaintyReason union (so 3.0.6 next-intl copy renders), confidence via calculateDisplayConfidence (engine returns 0..100). Real freshness replaces resolveFixtureSunFreshness on the real path; weather uses the venue's own lat/lng (getCurrentWeather/getForecast), NOT the engine's hardcoded Gothenburg-centre call. Consume (do NOT re-tune) the 3.0.5 fail-closed coverage + 3.0.6 obstruction caps and the NREL solar math. Out of scope: RLS/security-advisor + types.ts regen (8.5), feedback/review persistence (8.4), shadow_casters re-import (8.1/8.1.1 done), admin/upload, DTO/URL/_state/query-key/cache contract changes. No deferred-work item targets 8.3 (none carried in). Design Gate = Epic-8-overall (no new screen; 5 refs + map-primary re-pass via the default seed path, no rebaseline). Test gate = nextjs-app tsc 0 / eslint 0 / vitest (>= baseline 66 files/555) / playwright real-route+mocked / 5 visual states + map-primary + story-review.sh 8-3-real-sun-shadow-weather-computation + API-boundary & monetization scans. story-file-audit (7 checks) PASS (ACs verbatim from epics.md incl. backticks; Epic-8 Design Gate near ACs; decisions-before-build task order; file impact incl. types.ts NOT regen; refs incl. CLAUDE.md/AGENTS.md/project-context/architecture, DESIGN.md/ux-spec N/A — no UI change; standard 4-command test gate). Draft baseline tsc/eslint/vitest not re-run by SM (no code edited; dev runs the baseline gate at Task 1.1).

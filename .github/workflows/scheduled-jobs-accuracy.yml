name: Accuracy Metrics Job

on:
  schedule:
    # Daily at 4 AM UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  run-job:
    name: Run Accuracy Metrics
    runs-on: ubuntu-latest
    
    steps:
      - name: Run Accuracy Metrics
        run: |
          echo "Running accuracy metrics job..."
          curl -X POST "${{ secrets.VERCEL_APP_URL }}/api/cron/accuracy-metrics" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -f -s -S -w "\nHTTP Status: %{http_code}\n" || exit 1

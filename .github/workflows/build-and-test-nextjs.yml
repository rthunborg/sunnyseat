name: Build and Test (Next.js)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Story 1.6 P10: cancel duplicate runs on the same ref so push + PR-open
# don't queue two parallel 3-iteration Lighthouse jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: nextjs-app/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit + component tests
        run: npm test

      - name: Bundle size check
        # Story 1.6 Task 7: tightened from 650 KB → 600 KB after the
        # Plan B re-baseline of NFR8 (PRD). 541 KB measured at 1.6
        # close-out gives ~60 KB of headroom for incremental Epic 2
        # additions before the next bump.
        #
        # Story 1.6 review (2026-05-07):
        #   P4: explicit FAIL when no .js files are found — without this,
        #       a broken build with empty `.next/static` returns total_kb=0
        #       and trivially passes the `-gt 600` check.
        #   P5: aggregate via single `gzip -c | wc -c` pipe instead of
        #       per-file `gzip -c {} \;` to avoid per-file gzip header
        #       overhead (≈10 bytes × N files inflation).
        #   P6: measures ALL static .js (not just route-loaded chunks);
        #       this is intentional — it's the upper bound of what could
        #       ship to a client. Per-route breakdown is W11 / future
        #       story scope.
        run: |
          js_files=$(find .next/static -name '*.js' -print)
          if [ -z "$js_files" ]; then
            echo "::error::No JS files found under .next/static — build appears broken or incomplete."
            exit 1
          fi
          total_size=$(find .next/static -name '*.js' -print0 | xargs -0 cat | gzip -c | wc -c)
          total_kb=$((total_size / 1024))
          echo "Total gzipped JS (aggregate, all static chunks): ${total_kb} KB"
          if [ "$total_kb" -le 0 ]; then
            echo "::error::Bundle size measurement returned 0 KB — gzip pipeline failed."
            exit 1
          fi
          if [ "$total_kb" -gt 600 ]; then
            echo "::error::JS bundle size (${total_kb} KB) exceeds 600 KB budget"
            exit 1
          fi
          echo "Bundle size within 600 KB budget (includes lazy-loaded map library)"

      - name: Verify maplibre is async-loaded
        run: node scripts/verify-maplibre-async.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Story 1.6 P7 + Round 2 R2-P6: route E2E and A11y to dedicated
      # Playwright projects so axe.spec.ts cannot accidentally double-
      # execute. Round 1 used `--grep-invert "a11y:"` which depended on
      # every test title in axe.spec.ts beginning with the literal `a11y:`
      # prefix — a naming convention with no schema, lint, or PR-template
      # enforcement. R-007 found a future contributor adding
      # `test('contrast check on /', ...)` to axe.spec.ts would cause
      # double-execution silently. The `mobile` + `desktop` projects now
      # `testIgnore: '**/axe.spec.ts'` and the dedicated `a11y` project
      # `testMatch: '**/axe.spec.ts'` (see `playwright.config.ts`).
      - name: E2E tests
        run: npx playwright test --project=mobile --project=desktop

      - name: A11y tests (axe-core)
        run: npx playwright test --project=a11y

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: nextjs-app/test-results/

      # Story 1.6 P8: share .next/ with the lighthouse job rather than
      # rebuilding. Avoids env drift between jobs and saves ~2 min per push.
      - name: Upload build artifact for Lighthouse
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: nextjs-app/.next/
          retention-days: 1

  lighthouse:
    runs-on: ubuntu-latest
    needs: build-and-test
    defaults:
      run:
        working-directory: nextjs-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: nextjs-app/package-lock.json
      - run: npm ci
      # Story 1.6 P8: download the build from build-and-test instead of
      # rebuilding. The build manifest, chunks, and route data are all
      # required by `npm start` which lighthouse drives.
      - uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: nextjs-app/.next/
      - name: Lighthouse CI
        run: npm run lighthouse
      # Story 1.6 P9: always upload .lighthouseci/ so passing runs leave
      # a baseline for trend comparison; not just failures.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lhci-report
          path: nextjs-app/.lighthouseci/

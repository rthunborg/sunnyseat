name: Build and Test (Next.js)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Story 1.6 P10: cancel duplicate runs on the same ref so push + PR-open
# don't queue two parallel 3-iteration Lighthouse jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: nextjs-app/package-lock.json

      - run: npm ci --no-audit

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit + component tests
        run: npm test

      - name: Verify JS bundle budgets
        # Deterministic level-9 gzip accounting from Next's route diagnostics.
        # Enforces 280 KiB initial, 320 KiB MapLibre-loaded, and 600 KiB
        # all-emitted static JS caps.
        run: npm run bundle:verify

      - name: Verify MapLibre async boundary across all routes
        run: node scripts/verify-maplibre-async.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # Story 1.6 P7 + Round 2 R2-P6: route E2E and A11y to dedicated
      # Playwright projects so axe.spec.ts cannot accidentally double-
      # execute. Round 1 used `--grep-invert "a11y:"` which depended on
      # every test title in axe.spec.ts beginning with the literal `a11y:`
      # prefix — a naming convention with no schema, lint, or PR-template
      # enforcement. R-007 found a future contributor adding
      # `test('contrast check on /', ...)` to axe.spec.ts would cause
      # double-execution silently. The `mobile` + `desktop` projects now
      # `testIgnore: '**/axe.spec.ts'` and the dedicated `a11y` project
      # `testMatch: '**/axe.spec.ts'` (see `playwright.config.ts`).
      - name: E2E tests
        run: npx playwright test --project=mobile --project=desktop

      # Story 11.2 (AC1): the real-touch thumb-grab drag proof. The `touch`
      # project (Pixel 5, Chromium + hasTouch) drives a raw CDP
      # Input.dispatchTouchEvent gesture — Chromium-only, so it lives in its own
      # project that the four standard projects testIgnore. Run it as a live CI
      # gate (chromium is already installed above) so a future hit-testing
      # regression fails the build instead of shipping green. The spec forces
      # `?_time=` for determinism (sun is server-computed from the wall clock).
      - name: E2E touch-drag (real touch, AC1)
        run: npx playwright test --project=touch

      - name: A11y tests (axe-core)
        run: npx playwright test --project=a11y

      - name: A11y mobile tests (axe-core)
        run: npx playwright test --project=a11y-mobile

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: nextjs-app/test-results/

      - name: Lighthouse CI
        run: npm run lighthouse

      # Preserve a report for both passing and failing Lighthouse runs.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lhci-report
          path: nextjs-app/.lighthouseci/
          include-hidden-files: true

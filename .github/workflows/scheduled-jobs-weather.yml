name: Weather Ingestion Job

on:
  schedule:
    # Daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run-job:
    name: Run Weather Ingestion
    runs-on: ubuntu-latest
    
    steps:
      - name: Run Weather Ingestion
        run: |
          echo "Running weather ingestion job..."
          curl -X POST "${{ secrets.VERCEL_APP_URL }}/api/cron/weather-ingestion" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -f -s -S -w "\nHTTP Status: %{http_code}\n" || exit 1

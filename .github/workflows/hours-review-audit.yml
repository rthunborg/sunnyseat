name: Hours Review Audit

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sunnyseat-hours-review-production
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    defaults:
      run:
        working-directory: nextjs-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nextjs-app/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build service-only audit runner
        run: >-
          npx --no-install esbuild scripts/audit-opening-hours.ts
          --bundle
          --platform=node
          --format=esm
          --outfile="$RUNNER_TEMP/audit-opening-hours.mjs"

      - name: Audit opening-hours freshness
        # The runner writes bounded counts plus the run ID to GITHUB_STEP_SUMMARY.
        run: node "$RUNNER_TEMP/audit-opening-hours.mjs"
        env:
          # The protected environment is explicitly enabled after the 42-venue
          # remediation gate; absence remains fail-closed and `false` is the
          # independent emergency stop.
          SUN_HOURS_AUDIT_ENABLED: ${{ vars.SUN_HOURS_AUDIT_ENABLED || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

name: Sun Geometry And Weather Snapshots

on:
  schedule:
    - cron: '7 22 * * *'
    - cron: '17 23 * * *'
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Job mode'
        required: true
        default: both
        type: choice
        options:
          - both
          - geometry
          - weather

permissions:
  contents: read

concurrency:
  group: sunnyseat-sun-geometry-weather-production
  cancel-in-progress: false

jobs:
  geometry:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'schedule' && (github.event.schedule == '7 22 * * *' || github.event.schedule == '17 23 * * *')) ||
        github.event.inputs.mode == 'both' ||
        github.event.inputs.mode == 'geometry'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    defaults:
      run:
        working-directory: nextjs-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nextjs-app/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build service-only geometry runner
        run: >-
          npx --no-install esbuild scripts/precompute-sun-geometry.ts
          --bundle
          --platform=node
          --format=esm
          --outfile="$RUNNER_TEMP/precompute-sun-geometry.mjs"

      - name: Precompute sun geometry
        run: node "$RUNNER_TEMP/precompute-sun-geometry.mjs"
        env:
          SUN_GEOMETRY_PRECOMPUTE_ENABLED: ${{ vars.SUN_GEOMETRY_PRECOMPUTE_ENABLED || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  weather:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'schedule' ||
        github.event.inputs.mode == 'both' ||
        github.event.inputs.mode == 'weather'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    defaults:
      run:
        working-directory: nextjs-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nextjs-app/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build service-only weather runner
        run: >-
          npx --no-install esbuild scripts/refresh-weather-snapshots.ts
          --bundle
          --platform=node
          --format=esm
          --outfile="$RUNNER_TEMP/refresh-weather-snapshots.mjs"

      - name: Refresh weather snapshots
        run: node "$RUNNER_TEMP/refresh-weather-snapshots.mjs"
        env:
          SUN_WEATHER_REFRESH_ENABLED: ${{ vars.SUN_WEATHER_REFRESH_ENABLED || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MET_NO_USER_AGENT: ${{ vars.MET_NO_USER_AGENT }}

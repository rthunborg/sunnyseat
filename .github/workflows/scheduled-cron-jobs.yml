name: Scheduled Cron Jobs

on:
  schedule:
    # Weather ingestion — daily at 02:00 UTC
    - cron: '0 2 * * *'
    # Precomputation scheduling — daily at 00:00 UTC
    - cron: '0 0 * * *'
    # Cache warmup — daily at 03:00 UTC
    - cron: '0 3 * * *'
    # Accuracy metrics — daily at 04:00 UTC
    - cron: '0 4 * * *'
    # OSM ingestion — weekly Monday at 05:00 UTC
    - cron: '0 5 * * 1'
    # Cleanup old data — weekly Sunday at 01:00 UTC
    - cron: '0 1 * * 0'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which cron job to run (leave empty for schedule-based)'
        required: false
        type: choice
        options:
          - weather-ingestion
          - precomputation-schedule
          - cache-warmup
          - accuracy-metrics
          - osm-ingestion
          - cleanup-old-data

env:
  PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}

jobs:
  weather-ingestion:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'weather-ingestion')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weather ingestion
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "$PRODUCTION_URL/api/cron/weather-ingestion" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")
          echo "Response: $response"
          if [ "$response" != "200" ]; then
            echo "::error::Weather ingestion failed with status $response"
            exit 1
          fi

  precomputation-schedule:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 0 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'precomputation-schedule')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger precomputation scheduling
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "$PRODUCTION_URL/api/cron/precomputation-schedule" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")
          echo "Response: $response"
          if [ "$response" != "200" ]; then
            echo "::error::Precomputation scheduling failed with status $response"
            exit 1
          fi

  cache-warmup:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'cache-warmup')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cache warmup
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "$PRODUCTION_URL/api/cron/cache-warmup" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")
          echo "Response: $response"
          if [ "$response" != "200" ]; then
            echo "::error::Cache warmup failed with status $response"
            exit 1
          fi

  accuracy-metrics:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 4 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'accuracy-metrics')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger accuracy metrics
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "$PRODUCTION_URL/api/cron/accuracy-metrics" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")
          echo "Response: $response"
          if [ "$response" != "200" ]; then
            echo "::error::Accuracy metrics failed with status $response"
            exit 1
          fi

  osm-ingestion:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 5 * * 1') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'osm-ingestion')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger OSM ingestion
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "$PRODUCTION_URL/api/cron/osm-ingestion" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")
          echo "Response: $response"
          if [ "$response" != "200" ]; then
            echo "::error::OSM ingestion failed with status $response"
            exit 1
          fi

  cleanup-old-data:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 1 * * 0') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'cleanup-old-data')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cleanup
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "$PRODUCTION_URL/api/cron/cleanup-old-data" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")
          echo "Response: $response"
          if [ "$response" != "200" ]; then
            echo "::error::Cleanup failed with status $response"
            exit 1
          fi
